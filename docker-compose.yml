services:
  fund-transfer-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://fund_transfer:fund_transfer_pass@postgres:5432/fund_transfer
      - FX_PROVIDER_URL=http://treasury-feed.internal/rates
      - FX_RATE_MAX_AGE_MINUTES=60
      - FX_RATE_DEVIATION_THRESHOLD_PCT=1
      - FX_REFRESH_INTERVAL_SECONDS=3600
      - FX_PROVIDER_TIMEOUT_SECONDS=5
      - USE_STATIC_RATES=false
      - TRANSFER_LIMIT_PER_TX_USD=50000
      - TRANSFER_LIMIT_PER_DAY_USD=100000
      - AML_SCREENING_THRESHOLD_USD=10000
      - SENDING_FEE_PCT=0.005
      - RECEIVING_FEE_PCT=0.003

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fund_transfer
      POSTGRES_USER: fund_transfer
      POSTGRES_PASSWORD: fund_transfer_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_transfer -d fund_transfer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
