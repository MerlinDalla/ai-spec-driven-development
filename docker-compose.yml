services:
  fund-transfer-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://fund_transfer:fund_transfer_pass@postgres:5432/fund_transfer

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fund_transfer
      POSTGRES_USER: fund_transfer
      POSTGRES_PASSWORD: fund_transfer_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_transfer -d fund_transfer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
