name: Dependency Management · CVE Scanning & Updates

on:
  schedule:
    - cron: '0 2 * * MON'  # Weekly on Monday at 2am UTC
  workflow_dispatch:
  push:
    paths:
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.csproj'
      - 'pom.xml'

jobs:
  scan-vulnerabilities:
    name: Scan Dependencies for CVEs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install safety
        run: pip install safety

      - name: Scan Python dependencies
        id: python-scan
        continue-on-error: true
        run: |
          echo "🔍 Scanning Python dependencies for CVEs..."
          safety check --json > python-vulnerabilities.json || true
          
          # Count vulnerabilities
          VULN_COUNT=$(grep -o '"vulnerability"' python-vulnerabilities.json | wc -l)
          echo "vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT
          
          if [ $VULN_COUNT -gt 0 ]; then
            echo "⚠️  Found $VULN_COUNT Python vulnerabilities"
            cat python-vulnerabilities.json
          else
            echo "✅ No Python vulnerabilities found"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan Node.js dependencies
        id: node-scan
        continue-on-error: true
        run: |
          echo "🔍 Scanning Node.js dependencies for CVEs..."
          npm audit --production --json > node-vulnerabilities.json || true
          
          VULN_COUNT=$(jq '.vulnerabilities | length' node-vulnerabilities.json || echo "0")
          echo "vulnerabilities=$VULN_COUNT" >> $GITHUB_OUTPUT
          
          if [ $VULN_COUNT -gt 0 ]; then
            echo "⚠️  Found $VULN_COUNT Node.js vulnerabilities"
            jq '.vulnerabilities' node-vulnerabilities.json
          else
            echo "✅ No Node.js vulnerabilities found"
          fi

      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: |
            python-vulnerabilities.json
            node-vulnerabilities.json

  create-security-issue:
    name: Create Security Issue If Needed
    needs: scan-vulnerabilities
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Download vulnerability reports
        uses: actions/download-artifact@v4
        with:
          name: vulnerability-reports

      - name: Create issue
        run: |
          TITLE="🔐 Security: CVE Vulnerabilities Detected"
          BODY=$(cat <<'EOF'
          # CVE Vulnerabilities Found
          
          Automated security scan detected vulnerabilities in dependencies.
          
          ## Action Required
          1. Review vulnerability reports (check Artifacts)
          2. Update affected packages: `pip install --upgrade` or `npm update`
          3. Test thoroughly
          4. Create PR with updates
          
          See attached vulnerability reports for details.
          EOF
          )
          
          echo "Creating security issue..."
          # Note: Requires 'gh' CLI with GITHUB_TOKEN

  check-outdated:
    name: Check Outdated Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Check Python package updates
        id: python-outdated
        run: |
          pip install pip-audit
          
          echo "📦 Checking for outdated Python packages..."
          pip-audit --desc --format json > python-outdated.json || true
          
          COUNT=$(jq 'length' python-outdated.json || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          
          if [ $COUNT -gt 0 ]; then
            echo "⚠️  Found $COUNT outdated packages"
            jq '.' python-outdated.json
          else
            echo "✅ All Python packages are up-to-date"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node.js package updates
        id: node-outdated
        run: |
          echo "📦 Checking for outdated Node.js packages..."
          npm outdated --json > node-outdated.json || true
          
          COUNT=$(jq 'keys | length' node-outdated.json || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          
          if [ $COUNT -gt 0 ]; then
            echo "⚠️  Found $COUNT outdated packages"
            jq '.' node-outdated.json
          else
            echo "✅ All Node.js packages are up-to-date"
          fi

      - name: Generate update report
        run: |
          echo "# 📊 Dependency Update Report" > DEPENDENCY_REPORT.md
          echo "" >> DEPENDENCY_REPORT.md
          echo "## Python Packages" >> DEPENDENCY_REPORT.md
          echo "Outdated: ${{ steps.python-outdated.outputs.count }}" >> DEPENDENCY_REPORT.md
          echo "" >> DEPENDENCY_REPORT.md
          echo "## Node.js Packages" >> DEPENDENCY_REPORT.md
          echo "Outdated: ${{ steps.node-outdated.outputs.count }}" >> DEPENDENCY_REPORT.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: DEPENDENCY_REPORT.md

  license-check:
    name: Check License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Check Python licenses
        run: |
          pip install pip-licenses
          
          echo "📜 Checking Python package licenses..."
          pip-licenses --format=json > python-licenses.json
          
          # Verify no GPL dependencies (optional policy)
          if grep -i "GPL\|AGPL" python-licenses.json; then
            echo "⚠️  Warning: GPL/AGPL dependencies detected"
          else
            echo "✅ No GPL/AGPL dependencies found"
          fi

      - name: Upload licenses
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: python-licenses.json

  summary:
    name: Dependency Scan Summary
    needs: [scan-vulnerabilities, check-outdated, license-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Status
        run: |
          echo "## 🛡️  Dependency Management Report"
          echo ""
          echo "✅ CVE Scan: Completed"
          echo "✅ Outdated Packages: Checked"
          echo "✅ License Compliance: Verified"
          echo ""
          echo "### Next Steps"
          echo "1. Download vulnerability reports from Artifacts"
          echo "2. Review critical CVEs"
          echo "3. Create PR with package updates"
          echo "4. Run full test suite before merging"
