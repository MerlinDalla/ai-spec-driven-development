name: Spec-Kit Pipeline

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Feature description (plain English)"
        required: true
        type: string
      workflow_id:
        description: "Spec-kit workflow to run"
        required: false
        default: "speckit"
        type: choice
        options:
          - speckit

jobs:
  speckit:
    name: Run Spec-Kit Workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Copilot CLI extension
        run: gh extension install github/gh-copilot --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install specify CLI
        run: npm install -g @github/specify@latest

      - name: Set allow-all-tools flag
        run: echo "SPECKIT_INTEGRATION_COPILOT_EXTRA_ARGS=--allow-all-tools" >> $GITHUB_ENV

      - name: Run Spec-Kit Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          specify workflow run ${{ inputs.workflow_id }} \
            -i spec="${{ inputs.spec }}" \
            --non-interactive

      - name: Upload generated specs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speckit-output
          path: specs/
          if-no-files-found: warn
